name: Release

# Publishing a GitHub release tagged vX.Y.Z stages that version on npm; a
# maintainer approves it with 2FA before it goes live.
on:
  release:
    types: [published]

permissions:
  contents: read
  # npm trusted publishing: an OIDC token instead of a stored npm token. It
  # also attaches a provenance attestation linking the package to this run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Trusted staged publishing needs the npm CLI 11.15 or later; bun
      # publish cannot authenticate with OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.15.0
      - run: bun install --frozen-lockfile

      - name: Check the tag names the package version
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # prepublishOnly runs bun run check first: types, tests, build, format.
      # npm refuses a version that is already published. The trusted
      # publisher may only stage, so nothing goes live without approval.
      - run: npm stage publish
